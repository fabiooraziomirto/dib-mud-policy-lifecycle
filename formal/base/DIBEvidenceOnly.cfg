\* Sigma_ev only: OPERATOR-COMMIT is removed, so the reachable state space is
\* exactly the one a remote party can drive. NoActiveWithoutCommit is then the
\* machine-checked form of the displayed quantifier in Sec. IV-B.
SPECIFICATION Spec

CONSTANTS
    Sites = {s1, s2, s3}
    Facts = {f1, f2}
    NoSite = none
    NoFact = nofact
    AllowCommit = FALSE

INVARIANTS
    TypeOK
    NoActiveWithoutCommit
    ExportRequiresActive
