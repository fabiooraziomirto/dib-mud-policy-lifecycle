[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dib"
version = "0.1.0"
description = "Device Intent Blueprint: cross-site corroboration for federated MUD profile governance"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "networkx>=3.3",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
