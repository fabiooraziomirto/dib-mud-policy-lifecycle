      - DIB_DIST_SITE_URL_8=http://site-8:8000
      - DIB_DIST_SITE_URL_9=http://site-9:8000
    volumes:
      - evidence_data:/data
    ports:
      - "18100:8000"
  site-0:
    build:
      context: ../../../..
      dockerfile: src/dib/registry/distributed/Dockerfile
    environment:
